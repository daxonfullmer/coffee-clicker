<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>☕ Coffee Clicker</h1>

        <div class="counter">
            Coffees: <span id="coffeeCount">0</span> / 30
        </div>

        <div class="coffee-area">
            <button id="coffeeButton">☕</button>
            <div id="cooldown"></div>
        </div>

        <p id="status">Click the coffee to wake up!</p>

        <div class="bar">
            <div id="dangerBar"></div>
        </div>

        <p id="dangerText">Caffeine: 0 / 10</p>

        <button id="restartButton">Restart</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
